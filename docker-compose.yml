services:
  # Service 1: Next.js Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devwrap-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always
  
  # Service 2: Local Redis Cache (fallback or local testing)
  redis:
    image: redis:7-alpine
    container_name: devwrap-redis
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
    restart: always
  
volumes:
    redis_data:
